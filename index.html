    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/png" href="/logo-compact.png" />
    <link rel="apple-touch-icon" href="/logo-compact.png" />

    <meta property="og:title" content="APS INTELLIGENCE" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #aps-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#080d0a}
      #aps-boot img{width:64px;height:64px;object-fit:contain;animation:bootpulse 2.2s ease-in-out infinite}
      #aps-boot .bar{width:96px;height:2px;border-radius:9999px;overflow:hidden;background:rgba(0,206,201,.16)}
      #aps-boot .bar span{display:block;height:100%;width:40%;border-radius:9999px;background:#00cec9;animation:bootslide 1.4s ease-in-out infinite}
      @keyframes bootpulse{0%,100%{transform:scale(.96);opacity:.85}50%{transform:scale(1.04);opacity:1}}
      @keyframes bootslide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
      @media (prefers-reduced-motion:reduce){#aps-boot img,#aps-boot .bar span{animation:none}}
    </style>
  </head>
  <body class="bg-[#080d0a] text-[#e8ebe4] antialiased selection:bg-[#c5a059]/30 selection:text-[#f7e7ce]">
    <div id="root"><div id="aps-boot" role="status" aria-label="Cargando APS Intelligence"><img src="/logo-compact.png" alt="" /><div class="bar"><span></span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
